<main class="sign-in">
  <div class="sign-in-language"><app-language-switch /></div>
  <section class="sign-in-card ro-card">
    <h1 class="sign-in-brand">{{ brand() }}</h1>
    <div class="sign-in-titles">
      <h2>{{ text().signIn.title }}</h2>
      <p class="hint">{{ text().signIn.hint }}</p>
    </div>
    <form class="ro-form" (submit)="onSubmit($event)">
      <app-field [label]="text().signIn.email" [control]="signInForm.email">
        <input type="email" dir="ltr" autocomplete="username" [formField]="signInForm.email" />
      </app-field>
      <app-field [label]="text().signIn.password" [control]="signInForm.password">
        <input
          type="password"
          dir="ltr"
          autocomplete="current-password"
          [formField]="signInForm.password"
        />
      </app-field>
      @if (problem(); as current) {
        <app-alert tone="danger">{{ text().problems[current] }}</app-alert>
      }
      <button appButton class="sign-in-submit" type="submit" [disabled]="submitting()">
        {{ text().signIn.submit }}
      </button>
    </form>
  </section>
</main>
