<form class="ro-form" (submit)="onSubmit($event)">
  <app-field
    [label]="text().form.fullName"
    [hint]="text().form.fullNameHint"
    [control]="driverForm.fullName"
  >
    <input type="text" [formField]="driverForm.fullName" />
  </app-field>
  <app-field [label]="text().form.phone" [optional]="true" [control]="driverForm.phone">
    <input type="tel" dir="ltr" [formField]="driverForm.phone" />
  </app-field>
  <app-field
    [label]="text().form.nationalId"
    [hint]="text().form.nationalIdHint"
    [optional]="true"
    [control]="driverForm.nationalId"
  >
    <input type="text" inputmode="numeric" dir="ltr" [formField]="driverForm.nationalId" />
  </app-field>
  <app-field
    [label]="text().form.licenseNumber"
    [optional]="true"
    [control]="driverForm.licenseNumber"
  >
    <input type="text" dir="ltr" [formField]="driverForm.licenseNumber" />
  </app-field>
  <app-field
    [label]="text().form.licenseExpiry"
    [hint]="text().form.licenseExpiryHint"
    [optional]="true"
    [control]="driverForm.licenseExpiry"
  >
    <input type="date" [formField]="driverForm.licenseExpiry" />
  </app-field>
  <fieldset>
    <legend>{{ text().form.payTitle }}</legend>
    <p class="hint">{{ text().form.payHint }}</p>
    <app-field
      [label]="text().form.monthlySalary"
      [hint]="text().form.amountHint"
      [optional]="true"
      [control]="driverForm.monthlySalary"
    >
      <input type="text" inputmode="decimal" dir="ltr" [formField]="driverForm.monthlySalary" />
      <bdi>{{ organization().currency }}</bdi>
    </app-field>
    <app-field
      [label]="text().form.tripPay"
      [hint]="text().form.tripPayHint"
      [optional]="true"
      [control]="driverForm.tripPay"
    >
      <input type="text" inputmode="decimal" dir="ltr" [formField]="driverForm.tripPay" />
      <bdi>{{ organization().currency }}</bdi>
    </app-field>
  </fieldset>
  <app-field
    [label]="text().form.notes"
    [hint]="text().form.notesHint"
    [optional]="true"
    [control]="driverForm.notes"
  >
    <textarea [formField]="driverForm.notes"></textarea>
  </app-field>
  <label class="checkbox">
    <input type="checkbox" [formField]="driverForm.active" />
    {{ text().form.active }}
  </label>
  @if (problem(); as current) {
    <app-alert tone="danger">{{ text().problems[current] }}</app-alert>
  }
  <div class="ro-toolbar">
    <button appButton type="submit" [disabled]="submitting()">
      {{ driver() ? text().form.save : text().form.add }}
    </button>
    <button appButton="secondary" type="button" (click)="cancelled.emit()">
      {{ text().form.cancel }}
    </button>
  </div>
</form>
