<app-public-hero>
  <div class="home-hero-grid">
    <div class="home-hero-copy">
      <app-home-offer />
      <p class="app-hero-eyebrow">
        <ng-icon [svg]="icons.sparkles" aria-hidden="true" />
        {{ text().home.eyebrow }}
      </p>
      <h1 class="app-hero-title">
        {{ text().home.title }}
        <span class="app-hero-highlight">{{ text().home.titleHighlight }}</span>
      </h1>
      <p class="app-hero-lead">{{ text().home.lead }}</p>
      <app-site-actions />
      <ul class="home-promises">
        @for (promise of promises; track promise.key) {
          <li>
            <ng-icon [svg]="promise.icon" aria-hidden="true" />
            <span>{{ text().home.promises[promise.key] }}</span>
          </li>
        }
      </ul>
    </div>

    <app-product-preview />
  </div>
</app-public-hero>
