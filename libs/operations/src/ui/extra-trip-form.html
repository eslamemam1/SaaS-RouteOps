<form class="ro-form" (submit)="onSubmit($event)">
  <p class="hint">{{ text().extra.hint }}</p>
  <app-field [label]="text().extra.route" [hint]="text().extra.routeHint" [optional]="true">
    <select (change)="useRoute($any($event.target).value)">
      <option value="" [selected]="model().routeId === ''">{{ text().extra.noRoute }}</option>
      @for (route of routes(); track route.id) {
        <option [value]="route.id" [selected]="model().routeId === route.id">
          {{ route.label }}
        </option>
      }
    </select>
  </app-field>
  <app-field
    [label]="text().extra.customer"
    [hint]="model().routeId ? text().extra.customerFromRoute : ''"
    [control]="extraForm.customerId"
  >
    <select [formField]="extraForm.customerId">
      <option value="">{{ text().extra.chooseCustomer }}</option>
      @for (customer of customers(); track customer.id) {
        <option [value]="customer.id">{{ customer.label }}</option>
      }
    </select>
  </app-field>
  <app-field [label]="text().extra.direction">
    <select [formField]="extraForm.direction">
      @for (direction of directions; track direction) {
        <option [value]="direction">{{ text().directions[direction] }}</option>
      }
    </select>
  </app-field>
  <app-field [label]="text().extra.time" [control]="extraForm.departureTime">
    <input type="time" [formField]="extraForm.departureTime" />
  </app-field>
  <app-field [label]="text().extra.vehicle" [optional]="true">
    <select [formField]="extraForm.vehicleId">
      <option value="">{{ text().extra.notSet }}</option>
      @for (vehicle of vehicles(); track vehicle.id) {
        <option [value]="vehicle.id">{{ vehicle.label }}</option>
      }
    </select>
  </app-field>
  <app-field [label]="text().extra.driver" [control]="extraForm.driverId">
    <select [formField]="extraForm.driverId">
      <option value="">{{ text().extra.chooseDriver }}</option>
      @for (driver of drivers(); track driver.id) {
        <option [value]="driver.id">{{ driver.label }}</option>
      }
    </select>
  </app-field>
  <app-field
    [label]="text().extra.tripPrice"
    [hint]="model().routeId ? text().extra.tripPriceRouteHint : text().extra.tripPriceHint"
    [optional]="true"
    [control]="extraForm.tripPrice"
  >
    <input type="text" inputmode="decimal" dir="ltr" [formField]="extraForm.tripPrice" />
    <bdi>{{ organization().currency }}</bdi>
  </app-field>
  <app-field [label]="text().extra.notes" [optional]="true" [control]="extraForm.notes">
    <textarea [formField]="extraForm.notes"></textarea>
  </app-field>
  @if (conflicts().length > 0) {
    <app-alert tone="warning">
      <p>{{ text().conflict.formHint }}</p>
      <app-conflict-list [conflicts]="conflicts()" [choices]="choices()" />
    </app-alert>
  }
  @if (problem(); as current) {
    <app-alert tone="danger">{{ text().problems[current] }}</app-alert>
  }
  <div class="ro-toolbar">
    <button appButton type="submit" [disabled]="submitting()">{{ text().extra.save }}</button>
    <button appButton="secondary" type="button" (click)="cancelled.emit()">
      {{ text().extra.cancel }}
    </button>
  </div>
</form>
