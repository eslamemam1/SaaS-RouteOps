<form class="ro-form" (submit)="onSubmit($event)">
  <app-field [label]="text().form.name" [hint]="text().form.nameHint" [control]="customerForm.name">
    <input type="text" [formField]="customerForm.name" />
  </app-field>
  <app-field
    [label]="text().form.contactName"
    [hint]="text().form.contactNameHint"
    [optional]="true"
    [control]="customerForm.contactName"
  >
    <input type="text" [formField]="customerForm.contactName" />
  </app-field>
  <app-field [label]="text().form.phone" [optional]="true" [control]="customerForm.phone">
    <input type="tel" dir="ltr" [formField]="customerForm.phone" />
  </app-field>
  <app-field [label]="text().form.email" [optional]="true" [control]="customerForm.email">
    <input type="email" dir="ltr" [formField]="customerForm.email" />
  </app-field>
  <app-field [label]="text().form.address" [optional]="true" [control]="customerForm.address">
    <input type="text" [formField]="customerForm.address" />
  </app-field>
  <app-field
    [label]="text().form.notes"
    [hint]="text().form.notesHint"
    [optional]="true"
    [control]="customerForm.notes"
  >
    <textarea [formField]="customerForm.notes"></textarea>
  </app-field>
  <label class="checkbox">
    <input type="checkbox" [formField]="customerForm.active" />
    {{ text().form.active }}
  </label>
  @if (problem(); as current) {
    <app-alert tone="danger">{{ text().problems[current] }}</app-alert>
  }
  <div class="ro-toolbar">
    <button appButton type="submit" [disabled]="submitting()">
      {{ customer() ? text().form.save : text().form.add }}
    </button>
    <button appButton="secondary" type="button" (click)="cancelled.emit()">
      {{ text().form.cancel }}
    </button>
  </div>
</form>
