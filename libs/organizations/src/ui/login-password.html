<form class="ro-form" (submit)="onSubmit($event)">
  <p class="hint">{{ text().password.hint }}</p>
  <app-field [label]="text().password.login">
    <input type="email" dir="ltr" readonly [value]="login().email" />
  </app-field>
  <app-field
    [label]="text().password.password"
    [hint]="text().password.passwordHint"
    [control]="passwordForm.password"
  >
    <input
      type="text"
      dir="ltr"
      autocomplete="new-password"
      spellcheck="false"
      [formField]="passwordForm.password"
    />
  </app-field>
  @if (problem(); as current) {
    <app-alert tone="danger">{{ text().problems[current] }}</app-alert>
  }
  <div class="ro-toolbar">
    <button appButton type="submit" [disabled]="busy()">
      {{ text().password.submit }}
    </button>
    <button appButton="secondary" type="button" (click)="cancelled.emit()">
      {{ text().password.cancel }}
    </button>
  </div>
</form>
