<form class="ro-form" (submit)="onSubmit($event)">
  <app-field [label]="text().provision.name" [control]="companyForm.organizationName">
    <input type="text" [formField]="companyForm.organizationName" />
  </app-field>
  <app-field [label]="text().provision.email" [control]="companyForm.email">
    <input type="email" dir="ltr" autocomplete="off" [formField]="companyForm.email" />
  </app-field>
  <app-field
    [label]="text().provision.password"
    [hint]="text().provision.passwordHint"
    [control]="companyForm.password"
  >
    <input
      type="password"
      dir="ltr"
      autocomplete="new-password"
      [formField]="companyForm.password"
    />
  </app-field>
  <app-field [label]="text().provision.currency" [hint]="text().provision.currencyHint">
    <app-select [formField]="companyForm.currency">
      @for (currency of currencies; track currency) {
        <app-option [value]="currency" [label]="text().currencies[currency]" />
      }
    </app-select>
  </app-field>
  <app-field [label]="text().provision.timeZone" [hint]="text().provision.timeZoneHint">
    <app-select [formField]="companyForm.timeZone">
      @for (zone of timeZones; track zone) {
        <app-option [value]="zone" [label]="text().timeZones[zone]" />
      }
    </app-select>
  </app-field>
  @if (succeeded()) {
    <app-alert tone="success">{{ text().provision.created }}</app-alert>
  }
  @if (problem(); as current) {
    <app-alert tone="danger">{{ text().problems[current] }}</app-alert>
  }
  <div class="ro-toolbar">
    <button appButton type="submit" [disabled]="submitting()">
      {{ text().provision.submit }}
    </button>
  </div>
</form>
