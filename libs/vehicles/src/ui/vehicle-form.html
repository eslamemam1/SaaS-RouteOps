<form class="ro-form" (submit)="onSubmit($event)">
  <app-field
    [label]="text().form.plateNumber"
    [hint]="text().form.plateNumberHint"
    [control]="vehicleForm.plateNumber"
  >
    <input type="text" [formField]="vehicleForm.plateNumber" />
  </app-field>
  <app-field [label]="text().form.type" [control]="vehicleForm.type">
    <select [formField]="vehicleForm.type">
      <option value="">{{ text().form.chooseType }}</option>
      @for (type of types; track type) {
        <option [value]="type">{{ text().types[type] }}</option>
      }
    </select>
  </app-field>
  <app-field
    [label]="text().form.model"
    [hint]="text().form.modelHint"
    [optional]="true"
    [control]="vehicleForm.model"
  >
    <input type="text" [formField]="vehicleForm.model" />
  </app-field>
  <app-field [label]="text().form.year" [optional]="true" [control]="vehicleForm.year">
    <input type="text" inputmode="numeric" dir="ltr" [formField]="vehicleForm.year" />
  </app-field>
  <app-field
    [label]="text().form.seats"
    [hint]="text().form.seatsHint"
    [optional]="true"
    [control]="vehicleForm.seats"
  >
    <input type="text" inputmode="numeric" dir="ltr" [formField]="vehicleForm.seats" />
  </app-field>
  <app-field
    [label]="text().form.licenseExpiry"
    [hint]="text().form.licenseExpiryHint"
    [optional]="true"
    [control]="vehicleForm.licenseExpiry"
  >
    <input type="date" [formField]="vehicleForm.licenseExpiry" />
  </app-field>
  <app-field [label]="text().form.ownership" [hint]="text().form.ownershipHint">
    <select [formField]="vehicleForm.ownership">
      @for (ownership of ownerships; track ownership) {
        <option [value]="ownership">{{ text().ownerships[ownership] }}</option>
      }
    </select>
  </app-field>
  @if (model().ownership !== 'owned') {
    <app-field
      [label]="text().form.ownerName"
      [hint]="text().form.ownerNameHint"
      [control]="vehicleForm.ownerName"
    >
      <input type="text" [formField]="vehicleForm.ownerName" />
    </app-field>
    <app-field
      [label]="text().form.ownerPhone"
      [optional]="true"
      [control]="vehicleForm.ownerPhone"
    >
      <input type="tel" dir="ltr" [formField]="vehicleForm.ownerPhone" />
    </app-field>
    <app-field [label]="text().form.rentType" [hint]="text().form.rentTypeHint">
      <select [formField]="vehicleForm.rentType">
        @for (rentType of rentTypes; track rentType) {
          <option [value]="rentType">{{ text().rentTypes[rentType] }}</option>
        }
      </select>
    </app-field>
    @if (model().rentType === 'monthly') {
      <app-field
        [label]="text().form.monthlyRent"
        [hint]="text().form.amountHint"
        [control]="vehicleForm.monthlyRent"
      >
        <input type="text" inputmode="decimal" dir="ltr" [formField]="vehicleForm.monthlyRent" />
      </app-field>
    }
    @if (model().rentType === 'perTrip') {
      <p class="hint">{{ text().form.tripRentHint }}</p>
      <app-field
        [label]="text().form.outboundRent"
        [hint]="text().form.amountHint"
        [control]="vehicleForm.outboundRent"
      >
        <input type="text" inputmode="decimal" dir="ltr" [formField]="vehicleForm.outboundRent" />
      </app-field>
      <app-field
        [label]="text().form.returnRent"
        [hint]="text().form.amountHint"
        [control]="vehicleForm.returnRent"
      >
        <input type="text" inputmode="decimal" dir="ltr" [formField]="vehicleForm.returnRent" />
      </app-field>
    }
  }
  <app-field
    [label]="text().form.notes"
    [hint]="text().form.notesHint"
    [optional]="true"
    [control]="vehicleForm.notes"
  >
    <textarea [formField]="vehicleForm.notes"></textarea>
  </app-field>
  <label class="checkbox">
    <input type="checkbox" [formField]="vehicleForm.active" />
    {{ text().form.active }}
  </label>
  @if (problem(); as current) {
    <app-alert tone="danger">{{ text().problems[current] }}</app-alert>
  }
  <div class="ro-toolbar">
    <button appButton type="submit" [disabled]="submitting()">
      {{ vehicle() ? text().form.save : text().form.add }}
    </button>
    <button appButton="secondary" type="button" (click)="cancelled.emit()">
      {{ text().form.cancel }}
    </button>
  </div>
</form>
