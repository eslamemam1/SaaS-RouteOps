<h2>Sign in</h2>
<form (submit)="onSubmit($event)">
  <label>
    Email
    <input type="email" autocomplete="username" [formField]="signInForm.email" />
  </label>
  @if (signInForm.email().touched() && signInForm.email().errors()[0]; as error) {
    <p>{{ error.message }}</p>
  }
  <label>
    Password
    <input
      type="password"
      autocomplete="current-password"
      [formField]="signInForm.password"
    />
  </label>
  @if (signInForm.password().touched() && signInForm.password().errors()[0]; as error) {
    <p>{{ error.message }}</p>
  }
  <button type="submit" [disabled]="submitting()">Sign in</button>
</form>
@if (message()) {
  <p>{{ message() }}</p>
}
