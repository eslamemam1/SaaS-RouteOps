<div class="ro-card-header">
  <h2 class="ro-card-title">{{ text().holiday.title }}</h2>
  <p class="hint">{{ text().holiday.hint }}</p>
</div>
<div class="ro-card-body">
  @if (customers().length === 0) {
    <p class="hint">{{ text().holiday.none }}</p>
  } @else {
    <div class="ro-checklist">
      @for (customer of customers(); track customer.id) {
        <label class="checkbox">
          <input
            type="checkbox"
            [checked]="selected().has(customer.id)"
            (change)="toggle(customer.id, $any($event.target).checked)"
          />
          {{ customer.label }}
        </label>
      }
    </div>
    <div class="ro-toolbar">
      <button
        appButton="danger"
        type="button"
        [disabled]="submitting() || selected().size === 0"
        (click)="record()"
      >
        {{ text().holiday.submit }}
      </button>
    </div>
  }
  @if (done()) {
    <app-alert tone="success">{{ text().holiday.done }}</app-alert>
  }
  @if (problem(); as current) {
    <app-alert tone="danger">{{ text().problems[current] }}</app-alert>
  }
</div>
