<h2>تسجيل الدخول</h2>
<form (submit)="onSubmit($event)">
  <label>
    البريد الإلكتروني
    <input
      type="email"
      dir="ltr"
      autocomplete="username"
      [formField]="signInForm.email"
    />
  </label>
  @if (signInForm.email().touched() && signInForm.email().errors()[0]; as error) {
    <p>{{ error.message }}</p>
  }
  <label>
    كلمة المرور
    <input
      type="password"
      dir="ltr"
      autocomplete="current-password"
      [formField]="signInForm.password"
    />
  </label>
  @if (signInForm.password().touched() && signInForm.password().errors()[0]; as error) {
    <p>{{ error.message }}</p>
  }
  <button type="submit" [disabled]="submitting()">دخول</button>
</form>
@if (message()) {
  <p>{{ message() }}</p>
}
